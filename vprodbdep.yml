apiVersion: apps/v1
kind: Deployment
metadata:
  name: vprodb
  labels:
    app: vprodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vprodb
  template:
    metadata:
      labels:
        app: vprodb
    spec:
      imagePullSecrets:
      - name: harbor-registry
      containers:
      - name: vprodb
        image: harbor.pr1/docker_build/my-db:latest
        ports:
        - name: vprodb-port
          containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: db-pass
        volumeMounts:
        - name: vpro-db-data
          mountPath: /var/lib/mysql

      initContainers:
      - name: busybox
        image: busybox:latest
        args: ["rm", "-rf", "/var/lib/mysql/lost+found"]
        volumeMounts:
        - name: vpro-db-data
          mountPath: /var/lib/mysql

      volumes:
      - name: vpro-db-data
        hostPath:
          path: /mnt/data/mysql
          type: DirectoryOrCreate
